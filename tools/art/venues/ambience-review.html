<!doctype html><meta charset="utf-8"><title>Living courts review</title>
<style>body{background:#100c1c;color:#eee;font:16px system-ui;margin:24px}button{padding:10px;margin-right:10px}main{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}figure{margin:0;background:#211830}img{width:100%;display:block}figcaption{padding:10px}header{margin-bottom:20px}</style>
<header><h1>Living courts · registered environmental effects</h1><p>Ocean highlights and existing fixtures animate without moving scenery. Frames 4–7 show a match-win lighting response. This preview isolates environment effects; crowd animations have a separate review.</p><button id="toggle">Pause</button><button id="step">Next frame</button><span id="status"></span></header><main id="courts"></main>
<script>const entries=[['beach','Muscle Pier · water and lanterns'],['concrete','Bar · sea glints and warm lanterns'],['lawn','Rooftop · water and neon equipment'],['clay','Industrial yard · beacon lamps'],['tiled','Arcade · cabinet displays and neon'],['stadium','Stadium · venue lighting']];let frame=0,play=true;for(const[id,label]of entries){const f=document.createElement('figure');f.innerHTML=`<img id="${id}"><figcaption>${label}</figcaption>`;courts.append(f);for(let i=0;i<8;i++){const p=new Image;p.src=`${id}-${i}.png`}}function render(){for(const[id]of entries)document.getElementById(id).src=`${id}-${frame}.png`;status.textContent=`Frame ${frame} · ${frame<4?'During play':'Match won'}`;}toggle.onclick=()=>{play=!play;toggle.textContent=play?'Pause':'Play'};step.onclick=()=>{play=false;frame=(frame+1)%8;render()};setInterval(()=>{if(play){frame=(frame+1)%8;render()}},400);render()</script>
