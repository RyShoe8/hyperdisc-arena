<!doctype html><meta charset="utf-8"><title>Bar court crowd review</title>
<style>body{margin:0;background:#130d20;color:#fff;font:16px system-ui}header{padding:16px}button{padding:8px;margin-right:12px}img{width:100%;display:block}#zoom{height:260px;background-size:1672px 941px;background-position:-420px -100px;background-repeat:no-repeat;border-top:2px solid #ff2e88}</style>
<header><b>Bar court · twelve registered spectators</b><p>Alternating Team A and Team B points. The opposing fans remain seated. Court artwork stays unchanged.</p><button id="pause">Pause</button><button id="step">Next frame</button><span id="label"></span></header><div id="zoom"></div><img id="scene">
<script>let n=0,playing=true;const images=Array.from({length:36},(_,i)=>{const im=new Image;im.src=`preview/${String(i).padStart(2,'0')}.png`;return im});function render(){scene.src=images[n].src;zoom.style.backgroundImage=`url('${images[n].src}')`;label.textContent=`Frame ${n} · ${n<2?'Watching':n<13?'Team A scores':n<24?'Team B scores':'Quiet gestures'}`;}pause.onclick=()=>{playing=!playing;pause.textContent=playing?'Pause':'Play'};step.onclick=()=>{playing=false;n=(n+1)%36;render()};setInterval(()=>{if(playing){n=(n+1)%36;render()}},200);render()</script>
